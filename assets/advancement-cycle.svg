<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Advancement rhythm diagram</title>
  <desc id="desc">A branded diagram showing cultivation, solicitation, and stewardship as a repeating advancement cycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f7f0e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0c223c" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="34" y="34" width="652" height="552" rx="38" fill="url(#bg)" stroke="#e8ddca" filter="url(#shadow)"/>
  <circle cx="360" cy="310" r="172" fill="none" stroke="#e8ddca" stroke-width="18"/>
  <path d="M520 302c4 61-26 119-78 153" fill="none" stroke="#c99a45" stroke-width="18" stroke-linecap="round"/>
  <path d="M281 466c-56-29-91-86-91-149" fill="none" stroke="#314d2d" stroke-width="18" stroke-linecap="round"/>
  <path d="M219 221c37-50 101-75 162-62" fill="none" stroke="#17365d" stroke-width="18" stroke-linecap="round"/>
  <g fill="#0c223c">
    <circle cx="360" cy="164" r="66" fill="#17365d"/>
    <circle cx="486" cy="388" r="66" fill="#314d2d"/>
    <circle cx="234" cy="388" r="66" fill="#c99a45"/>
  </g>
  <g fill="#fffaf1" stroke="#fffaf1" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M338 163h44M360 141v44"/>
    <path d="M465 373h42v35h-42zM472 373v-14h28v14" fill="none"/>
    <path d="M212 382l19 20 36-43" fill="none"/>
  </g>
  <g font-family="Inter Tight, Arial, sans-serif" text-anchor="middle">
    <text x="360" y="255" font-size="18" font-weight="800" fill="#314d2d" letter-spacing="2">ADVANCEMENT RHYTHM</text>
    <text x="360" y="306" font-size="42" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" fill="#0c223c">Cultivate</text>
    <text x="360" y="346" font-size="42" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" fill="#0c223c">Ask</text>
    <text x="360" y="386" font-size="42" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" fill="#0c223c">Steward</text>
    <text x="360" y="433" font-size="18" fill="#626262">A system your team can keep running</text>
    <text x="360" y="164" font-size="16" font-weight="900" fill="#fffaf1">CULTIVATION</text>
    <text x="486" y="388" font-size="16" font-weight="900" fill="#fffaf1">ASK</text>
    <text x="234" y="388" font-size="16" font-weight="900" fill="#0c223c">STEWARDSHIP</text>
  </g>
  <g fill="#fffaf1" stroke="#e8ddca">
    <rect x="86" y="90" width="164" height="72" rx="18"/>
    <rect x="470" y="90" width="164" height="72" rx="18"/>
    <rect x="278" y="502" width="164" height="72" rx="18"/>
  </g>
  <g font-family="Inter Tight, Arial, sans-serif" fill="#0c223c">
    <text x="168" y="119" text-anchor="middle" font-size="14" font-weight="800">Before the ask</text>
    <text x="168" y="143" text-anchor="middle" font-size="13" fill="#626262">Build trust</text>
    <text x="552" y="119" text-anchor="middle" font-size="14" font-weight="800">During the ask</text>
    <text x="552" y="143" text-anchor="middle" font-size="13" fill="#626262">Invite support</text>
    <text x="360" y="531" text-anchor="middle" font-size="14" font-weight="800">After the gift</text>
    <text x="360" y="555" text-anchor="middle" font-size="13" fill="#626262">Show impact</text>
  </g>
</svg>
